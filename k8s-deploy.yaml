# Applied to the woowtech k3s cluster on 2026-08-03 (namespace: emqx-mcp).
# Everything below is already live except the image, which must be built and
# pushed first:
#   docker build -t ttl.sh/woow-emqx-mcp-admin:24h .
#   docker push  ttl.sh/woow-emqx-mcp-admin:24h
#
# Public URL: https://emqx-mcp.woowtech.io  (Cloudflare tunnel
# de5c466e-7826-4a5b-882d-128f8a31bc92 -> emqx-mcp-admin.emqx-mcp:8080)
apiVersion: v1
kind: Namespace
metadata:
  name: emqx-mcp
  labels:
    app.kubernetes.io/part-of: woow-emqx-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx-mcp-admin
  namespace: emqx-mcp
  labels:
    app.kubernetes.io/name: emqx-mcp-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx-mcp-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx-mcp-admin
    spec:
      initContainers:
        # /data is an emptyDir so the app can rewrite config.json at runtime;
        # the Secret only seeds it.
        - name: seed-config
          image: busybox:1.36
          command: ["sh","-c","cp /seed/config.json /data/config.json && chmod 600 /data/config.json"]
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: data, mountPath: /data }
      containers:
        - name: admin
          image: ttl.sh/woow-emqx-mcp-admin:24h
          imagePullPolicy: Always
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: MCP_ADMIN_CONFIG, value: /data/config.json }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: emqx-mcp-jwt, key: secret } }
            - { name: JWT_EXPIRY_HOURS, value: "24" }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 1000m, memory: 768Mi }
      volumes:
        - name: seed
          secret: { secretName: emqx-mcp-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-mcp-admin
  namespace: emqx-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emqx-mcp-admin
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
