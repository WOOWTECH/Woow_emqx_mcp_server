# Applied to the woowtech k3s cluster (namespace: emqx-mcp).
#
# Build and push the image first. Locally:
#   docker build -t ghcr.io/woowtech/woow-emqx-mcp-admin:v1.0.0 .
#   docker push  ghcr.io/woowtech/woow-emqx-mcp-admin:v1.0.0
#
# Or in-cluster with kaniko, mounting a dockerconfigjson Secret that holds a
# GHCR token with write:packages, which is how the live image was built:
#   kubectl create job emqx-mcp-build --image=gcr.io/kaniko-project/executor:v1.23.2 -- \
#     --context=git://github.com/WOOWTECH/Woow_emqx_mcp_server.git#refs/heads/main \
#     --dockerfile=Dockerfile \
#     --destination=ghcr.io/woowtech/woow-emqx-mcp-admin:v1.0.0
#
# The pull Secret below (ghcr-pull) is only needed while the GHCR package is
# private. Make the package public and you can drop imagePullSecrets entirely.
#
# Public URL: https://emqx-mcp.woowtech.io  (Cloudflare tunnel
# de5c466e-7826-4a5b-882d-128f8a31bc92 -> emqx-mcp-admin.emqx-mcp:8080)
apiVersion: v1
kind: Namespace
metadata:
  name: emqx-mcp
  labels:
    app.kubernetes.io/part-of: woow-emqx-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx-mcp-admin
  namespace: emqx-mcp
  labels:
    app.kubernetes.io/name: emqx-mcp-admin
    app.kubernetes.io/part-of: woow-emqx-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx-mcp-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx-mcp-admin
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # /data is an emptyDir so the app can rewrite config.json at runtime;
        # the Secret only seeds it.
        - name: seed-config
          image: busybox:1.36
          command: ["sh","-c","cp /seed/config.json /data/config.json && chmod 600 /data/config.json"]
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: data, mountPath: /data }
      containers:
        - name: admin
          image: ghcr.io/woowtech/woow-emqx-mcp-admin:v1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: MCP_ADMIN_CONFIG, value: /data/config.json }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: emqx-mcp-jwt, key: secret } }
            - { name: JWT_EXPIRY_HOURS, value: "24" }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 1000m, memory: 768Mi }
      volumes:
        - name: seed
          secret: { secretName: emqx-mcp-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-mcp-admin
  namespace: emqx-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emqx-mcp-admin
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
