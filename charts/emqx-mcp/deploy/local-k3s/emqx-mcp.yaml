# Instance values for the ONE deployment that exists: release emqx-mcp in
# namespace emqx-mcp on the local laptop cluster (kubectl context `default`),
# fronted by that cluster's cloudflared for https://emqx-mcp.woowtech.io.
#
# No secrets here. emqx-mcp-config, emqx-mcp-jwt and ghcr-pull already exist in
# the namespace and secrets.create stays false, so a takeover cannot overwrite
# them. See examples/secrets.example.yaml for their shape.
#
# Take over the objects that `kubectl apply -f k8s-deploy.yaml` created, without
# restarting the pod:
#   helm --kube-context default upgrade --install emqx-mcp charts/emqx-mcp \
#     -n emqx-mcp --take-ownership \
#     -f charts/emqx-mcp/deploy/local-k3s/emqx-mcp.yaml
#
# Every value below equals the chart default EXCEPT service.labels, which
# reproduces a label the live Service carries but k8s-deploy.yaml never had
# (see below). They are spelled out so a drift check reads as a statement of
# what is deployed rather than an absence.
#
# NOTE: as of 2026-09-12 this deployment is down - the node the pod was
# scheduled on is NotReady and cloudflared is 0/1 - so the takeover above is a
# phase-2 action that needs a healthy cluster first.

# SAFETY: this file intentionally does NOT set `namespace:`. Placement is
# controlled ENTIRELY by `-n`/`--namespace`. Never add a `namespace:` key here:
# `emqx-mcp.ns` lets a values-file namespace silently win over `-n`, so a
# `-n <test-ns> -f deploy/local-k3s/emqx-mcp.yaml` rehearsal would write into
# the REAL live emqx-mcp namespace instead of the test one. That exact class of
# bug already created a stray namespace on production woow-k3s once.
#   helm upgrade --install emqx-mcp charts/emqx-mcp -n emqx-mcp \
#     -f charts/emqx-mcp/deploy/local-k3s/emqx-mcp.yaml
keepOnUninstall: true

image:
  repository: ghcr.io/woowtech/woow-emqx-mcp-admin
  tag: v1.0.0
  pullPolicy: IfNotPresent

imagePullSecret: ghcr-pull

replicas: 1

jwt:
  secretName: emqx-mcp-jwt
  secretKey: secret
  expiryHours: 24

config:
  secretName: emqx-mcp-config

service:
  type: ClusterIP
  port: 8080
  # The live Service emqx-mcp-admin carries this label; k8s-deploy.yaml never
  # did (no revision in git history has it - it was added out of band). Setting
  # it here means `--take-ownership` keeps the label instead of stripping it.
  # Service labels are not part of the selector, so this restarts nothing.
  labels:
    app.kubernetes.io/name: emqx-mcp-admin

# Live pod template has no securityContext. Leave this off: turning it on
# restarts the pod. See README "Follow-ups".
hardening:
  enabled: false

secrets:
  create: false
