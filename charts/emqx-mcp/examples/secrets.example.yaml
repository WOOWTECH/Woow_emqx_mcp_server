# -----------------------------------------------------------------------------
# The three Secrets charts/emqx-mcp references - PLACEHOLDERS ONLY.
# Never commit real values.
#
# k8s-deploy.yaml referenced these three and never created them, and the README
# wrongly claimed the manifest created one of them. They were made by hand on
# the cluster, so this file is the first record of their shape.
#
# Copy this file OUTSIDE the repository, replace every REPLACE_ME, then apply
# the copy:
#   kubectl --context <ctx> -n emqx-mcp apply -f /secure/path/emqx-mcp-secrets.yaml
#
# Or let the chart render them once, on a fresh install only:
#   helm install emqx-mcp charts/emqx-mcp -n emqx-mcp --create-namespace \
#     --set secrets.create=true \
#     --set secrets.adminPassword=... --set secrets.mcpAuthToken=... \
#     --set secrets.jwtSecret=... --set secrets.emqx.baseUrl=... \
#     --set secrets.emqx.apiKey=... --set secrets.emqx.apiSecret=... \
#     --set-file secrets.dockerConfigJson=/secure/path/dockerconfig.json
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: emqx-mcp-config
  namespace: emqx-mcp
  labels:
    app.kubernetes.io/part-of: woow-emqx-mcp
type: Opaque
stringData:
  # Copied to /data/config.json by the seed-config init container on every
  # start, so this Secret - not the GUI - is the source of truth.
  #   admin_password  the GUI login password (POST /api/auth/login)
  #   mcp_auth_token  the path token in /private_<token>/mcp/
  #   connection      EMQX dashboard URL plus an API key/secret pair created
  #                   under System -> API Key in the EMQX dashboard
  #   mcp_server      how the admin bundle spawns the MCP server as a child:
  #                   HTTP on 127.0.0.1:3000, so only the in-process proxy can
  #                   reach it
  config.json: |
    {
      "admin_password": "REPLACE_ME_ADMIN_PASSWORD",
      "mcp_auth_token": "REPLACE_ME_32_CHAR_URL_SAFE_TOKEN",
      "connection": {
        "emqx_mcp_base_url": "REPLACE_ME_http://broker:18083",
        "emqx_mcp_api_key": "REPLACE_ME_EMQX_API_KEY",
        "emqx_mcp_api_secret": "REPLACE_ME_EMQX_API_SECRET"
      },
      "tools": {
        "disabled_tools": [],
        "disabled_categories": [],
        "disabled_operations": {},
        "readonly": false,
        "permissions": { "allowed_tools": ["*"], "denied_tools": [] }
      },
      "mcp_server": {
        "command": "python3",
        "args": ["-m", "emqx_mcp_server.server", "--transport", "http",
                 "--host", "127.0.0.1", "--port", "3000"],
        "port": 3000,
        "env": {
          "EMQX_MCP_READONLY": "false",
          "EMQX_MCP_DISABLED_CATEGORIES": "",
          "EMQX_MCP_DISABLED_TOOLS": "",
          "EMQX_MCP_DISABLED_OPERATIONS": "{}"
        }
      },
      "proxy": { "timeout": 86400, "bearer_token": "" },
      "token_history": []
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: emqx-mcp-jwt
  namespace: emqx-mcp
  labels:
    app.kubernetes.io/part-of: woow-emqx-mcp
type: Opaque
stringData:
  # Signs admin sessions (JWT_SECRET). Generate with `openssl rand -base64 48`.
  # Never leave it unset: mcp_admin_core then invents a random one per process,
  # and every restart silently invalidates all sessions. Never use a published
  # value such as the `change-me` still in .env.example / docker-compose.yml.
  secret: "REPLACE_ME_JWT_SIGNING_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: emqx-mcp
  labels:
    app.kubernetes.io/part-of: woow-emqx-mcp
type: kubernetes.io/dockerconfigjson
stringData:
  # Pull credential for the private package
  # ghcr.io/woowtech/woow-emqx-mcp-admin. Create it with a read:packages token:
  #   kubectl -n emqx-mcp create secret docker-registry ghcr-pull \
  #     --docker-server=ghcr.io --docker-username=<gh-user> \
  #     --docker-password=<ghp_read_packages_token>
  # Needed only while the package is private: make it public and set
  # imagePullSecret="" instead.
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_ME_BASE64_USER_COLON_TOKEN"}}}'
