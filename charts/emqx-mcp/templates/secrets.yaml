{{- /*
The three Secrets the Deployment references. k8s-deploy.yaml only ever
referenced them - they were created by hand on the live cluster and the
repository had no record of them, which is why `kubectl apply -f
k8s-deploy.yaml` on a clean cluster hung in Init.

Rendered only with secrets.create=true. By default the chart still only
references them, so `helm upgrade` can never overwrite a live credential with
an empty value. Create them out of band from examples/secrets.example.yaml.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.config.secretName }}
  namespace: {{ include "emqx-mcp.ns" . }}
  labels:
    {{- include "emqx-mcp.partOf" . | nindent 4 }}
  {{- include "emqx-mcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  config.json: |
    {{- include "emqx-mcp.configJson" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.jwt.secretName }}
  namespace: {{ include "emqx-mcp.ns" . }}
  labels:
    {{- include "emqx-mcp.partOf" . | nindent 4 }}
  {{- include "emqx-mcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.jwt.secretKey }}: {{ required "secrets.jwtSecret is required when secrets.create=true" $s.jwtSecret | quote }}
{{- if .Values.imagePullSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret }}
  namespace: {{ include "emqx-mcp.ns" . }}
  labels:
    {{- include "emqx-mcp.partOf" . | nindent 4 }}
  {{- include "emqx-mcp.keepAnnotations" . | nindent 2 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ required "secrets.dockerConfigJson is required when secrets.create=true and imagePullSecret is set" $s.dockerConfigJson | quote }}
{{- end }}
{{- end }}
