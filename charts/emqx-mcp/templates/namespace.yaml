{{- /*
Namespace. One that equals the release namespace is skipped: Helm keeps its
release record there, so it is created with --create-namespace instead and can
never be deleted by `helm uninstall`.
*/ -}}
{{- if and .Values.namespace.create (ne .Values.namespace.name .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "emqx-mcp.partOf" . | nindent 4 }}
  {{- include "emqx-mcp.keepAnnotations" . | nindent 2 }}
{{- end }}
