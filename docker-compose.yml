services:
  emqx:
    image: emqx/emqx:5.8.8
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data

  emqx-mcp-admin:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me}
    volumes:
      - mcp_data:/data
    depends_on:
      - emqx

volumes:
  emqx_data:
  mcp_data:
